<style>

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a29;--pn:#162639;--ink:#e6eef7;--mut:#8da2ba;--ln:#294059;--sky:#41c3e2;--gold:#f2c230;--hi:#ff6b68;--mid:#f0a93a;--lo:#4cc38a;--mk:#4a3f12}}

<header><h1>Stop<b>Pyramid</b> KZ</h1><button class=th id=thb onclick="tgl()"></button><p>Жүйе үкім шығармайды: ол белгілерді көрсетіп, талдаушыға кезекті қауіп деңгейі бойынша ұсынады · SafeNet KZ, 3-трек</p><nav id="tabs"></nav></header>

<script>
const CARD=/\b\d{4}[ -]?\d{4}[ -]?\d{4}[ -]?\d{4}\b|\+?[78][ -]?7\d{2}[ -]?\d{3}[ -]?\d{2}[ -]?\d{2}\b/g;
const CAT={ret:['Нереальная доходность','#c8312f'],pay:['Перевод / карта','#d98a00'],urg:['Давление, срочность','#8a4fd1'],ref:['Реферальная модель','#1aa7c9'],prf:['«Выплаты», отзывы','#2c8a5b'],org:['Организатор, кураторы','#b08a00'],mit:['Смягчающий признак','#6b7f96']};
const R=[
['ret','Кепілдендірілген немесе жылдам пайда',.45,/(?<!не )гарантир\w*|пассивн\w* доход|(?<![a-zа-я0-9])[xх]\s?[2-9](?!\d)|удво\w+|100 ?% ?(?:прибыл|доход)|без риск\w*|кепілдік\w*|тәуекелсіз|екі есе|быстр\w+ (?:деньги|прибыл\w*)/g],
['pay','Kaspi арқылы немесе картаға төлем',.25,/kaspi\S*|каспи\S*|(?:на|в) карт[уеа]\w*|перев\w+ на|аудар\w*|halyk|халык/g],
['pay','Аударуға арналған жеке карта не нөмір',.4,CARD],
['urg','Қысым және асықтыру',.25,/остал\w+ \d+ (?:мест|слот)\w*|последн\w+ мест\w*|успей\w*|только сегодня|до конца дня|срочно|орын қалды|үлгер\w*/g],
['ref','Адам тартқаны үшін бонус',.35,/приведи\w*|пригласи\w*|реферал\w*|за каждого|% с (?:каждого|друг\w*)|дос шақыр\w*|шақырсаң|шақырған/g],
['prf','«Төлем» скриншоттары, пікір-прогревтер',.3,/выплат\w+ пришл\w*|скрин\w*|вывел\w*|мне пришло|получил\w* выплат\w*|қолыма түс\w*|төленді|отзыв\w*/g],
['org','Ұйымдастырушы немесе «куратор»',.2,/куратор\w*|наставник\w*|в лс|в личку|жазыңыз/g],
['mit','Лицензия немесе тәуекел туралы ескерту',.5,/лиценз\w*|арррфр|не гарантируем|возможны потери|риск\w* потер|тәуекел бар/g],
['mit','Пирамидалар туралы ескерту',.6,/осторожно.{0,25}пирамид|признак\w* пирамид|как не попасть|не переводите деньги|алаяқтардан сақ/g],
['mit','Қарапайым сатып алу-сату',.25,/продаю|продам|самовывоз|размер \w+|сатылады|доставк\w+/g]];
const D={sh:'ш',ch:'ч',zh:'ж',ya:'я',yu:'ю',yo:'ё',kh:'х',ts:'ц'},L={a:'а',b:'б',c:'с',d:'д',e:'е',f:'ф',g:'г',h:'х',i:'и',j:'ж',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',q:'к',r:'р',s:'с',t:'т',u:'у',v:'в',w:'в',x:'х',y:'ы',z:'з'};
const tr=s=>{s=s.toLowerCase();return /[a-z]{3}/.test(s)?s.replace(/sh|ch|zh|ya|yu|yo|kh|ts/g,m=>D[m]).replace(/[a-z]/g,c=>L[c]||c):''};
function ratio(t){if(!/влож|салса|инвест|взнос|получ|аласы|қайтар|верн|→|->|=>/.test(t))return 0;const n=(t.replace(CARD,' ').match(/\d{1,3}(?: \d{3})+|\d+/g)||[]).map(x=>+x.replace(/ /g,'')).filter(x=>x>=1000);for(let i=1;i<n.length;i++)if(n[i]/n[i-1]>=1.5)return n[i]/n[i-1];return 0}
function scan(raw){const t=raw.toLowerCase().replace(/ё/g,'е'),t2=tr(raw),hits=[];
for(const[c,n,w,re]of R){let cnt=0,sp=[],m;for(const s of[t,t2]){if(!s)continue;re.lastIndex=0;while((m=re.exec(s))){cnt++;if(s===t)sp.push([m.index,m.index+m[0].length,c]);if(!m[0])re.lastIndex++}}
if(cnt)hits.push({c,n,w:Math.min(w*(1+.15*(cnt-1)),w*1.3),sp})}
const r=ratio(t)||ratio(t2);if(r)hits.push({c:'ret',n:'Салымнан ×'+r.toFixed(1)+' пайда уәде етілген',w:.5,sp:[]});
const pos=hits.filter(h=>h.c!='mit'),mit=hits.filter(h=>h.c=='mit'),has=c=>pos.some(h=>h.c==c);
let p=1-pos.reduce((a,h)=>a*(1-h.w),1),combo=0;if(has('ret')&&has('pay')){p=Math.max(p,.8);combo=1}
p*=1-Math.min(.7,mit.reduce((a,h)=>a+h.w,0));return{p,hits,combo}}
const sh=t=>{const w=t.toLowerCase().replace(/\d+/g,'#').split(/\s+/),s=new Set();for(let i=0;i<w.length-2;i++)s.add(w.slice(i,i+3).join(' '));return s};
function similar(ms){for(let i=0;i<ms.length;i++)for(let j=i+1;j<ms.length;j++){if(ms[i].u===ms[j].u)continue;const a=sh(ms[i].t),b=sh(ms[j].t);if(a.size<2||b.size<2)continue;let k=0;a.forEach(x=>b.has(x)&&k++);if(k/(a.size+b.size-k)>=.5)return 1}return 0}
const lvl=p=>p>=.65?'high':p>=.35?'mid':'low',LN={high:'Жоғары',mid:'Орташа',low:'Төмен'};
function evalG(g){const ms=g.msgs.map(m=>({...m,...scan(m.t)})),ps=ms.map(m=>m.p).sort((a,b)=>b-a);
let p=1-(1-(ps[0]||0))*(1-.5*Math.max(0,(ps[1]||0)-.3))*(1-.35*Math.max(0,(ps[2]||0)-.3)),why=[];
const cats=new Set(ms.flatMap(m=>m.hits.filter(h=>h.c!='mit').map(h=>h.c)));
const pa=p,pm=ps[0]||0;if(cats.size>=4&&pm>=.3){p+=.1;why.push('6 белгі тобының '+cats.size+'-і бір мезгілде іске қосылды')}
if(similar(ms)&&pm>=.3){p+=.1;why.push('Әртүрлі аккаунттардан шаблонды хабарламалар (копипаст-прогрев)')}
const cards=[...new Set(ms.flatMap(m=>(m.t.match(CARD)||[]).map(x=>x.replace(/\D/g,''))))];
return{...g,ms,cards,p,pa,pm,why,cats:[...cats]}}
/* синтетические данные */
function mk(seed){return()=>(seed=seed*1664525+1013904223>>>0)/4294967296}
const rnd=mk(2026),pick=a=>a[Math.floor(rnd()*a.length)],fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const CP=['4400 4301 2345 6789','5169 4931 0088 1122','8 777 123 45 67','4405 6390 7711 0042'];
const SG=[c=>{const a=pick([3000,5000,10000,20000]);return`Вложи ${fmt(a)} тг — получи ${fmt(a*pick([2,3,5]))} тг уже сегодня! Перевод на Kaspi ${c}. Осталось ${1+Math.floor(rnd()*5)} места`},
c=>`${fmt(pick([5000,10000]))} салсаң ${fmt(pick([15000,30000,50000]))} аласың! Kaspi-ға аудар: ${c}. Орын қалды`,
c=>`Vlozhi ${pick([5,10,20])}000tg poluchi ${pick([15,30,60])}000tg garantirovanno, perevod na kaspi ${c}`,
c=>`Приведи друга — бонус 10% с каждого вложения. Гарантированный доход, переводи на карту ${c}`,
c=>`Инвестиционный проект без риска, пассивный доход x2, куратор поможет, пиши в лс`,
c=>`Девочки, выплата пришла ✅ скрин в закрепе. Успей до конца дня, места ограничены`];
const WK=['Куратор объяснит всё в лс','Выплаты пришли, скрин выше','Мен 3 күнде 50 000 тг қолыма түсті, дос шақырсаң бонус беремін','Осталось 2 места, успей до конца дня'];
const CH=['Всем привет!','Кто уже вложился? Отзывы пишите','Спасибо, очень полезно','Админ, когда следующий набор?'];
const BN=['Продаю куртку, размер M, цена 15000, оплата Kaspi, самовывоз','Бесплатный розыгрыш: подпишись на канал и отметь друга в комментариях','Депозит 12% годовых, лицензия АРРФР, возможны потери при досрочном закрытии','Осторожно, пирамиды! Признаки пирамиды: гарантированный доход и реферальные бонусы. Не переводите деньги','Родители, не забудьте перевести 2000 тг на Kaspi на подарок учителю','Скидки в магазине, доставка по городу, успей купить до конца дня','Всем привет! Кто идёт на тренировку в среду?','Курс английского стартует в понедельник, запись по ссылке','Набираем курьеров, оплата 2000 тг в час, пишите в лс','Отзыв: курс отличный, куратор группы помог разобраться','Новости: завтра в Шымкенте ожидается дождь','Кредит под 18% годовых, лицензия АРРФР, платёж через Kaspi в приложении'];
const NM={s:['Инвест Клуб KZ','Быстрые деньги 777','Kaspi Профит','Қазына Инвест','Умный доход','Money Team Shymkent'],b:['Барахолка Шымкент','Родительский чат 5Б','Розыгрыши бесплатно','Финграмотность KZ','Новости города','Футбол по средам','Курсы английского','Антифрод KZ','Работа Шымкент']};
const RAW=[];for(let i=0;i<60;i++){const sc=i%5<2,msgs=[],u=()=>'@u'+(1+Math.floor(rnd()*40));
if(sc){const card=pick(CP),weak=rnd()<.25,n=3+Math.floor(rnd()*3);for(let k=0;k<n;k++){const t=weak?pick(WK):pick(SG)(card);msgs.push({u:u(),t})}msgs.push({u:u(),t:pick(CH)})}
else{const pool=BN.slice(),n=3+Math.floor(rnd()*2);for(let k=0;k<n;k++)msgs.push({u:u(),t:pool.splice(Math.floor(rnd()*pool.length),1)[0]})}
RAW.push({id:i+1,name:pick(sc?NM.s:NM.b)+' #'+(i+1),pl:rnd()<.5?'Telegram':'WhatsApp',members:20+Math.floor(rnd()*900),y:sc,msgs})}
let G=RAW.map(evalG);const cm={};G.forEach(g=>g.cards.forEach(c=>(cm[c]=cm[c]||[]).push(g.id)));
G.forEach(g=>{const sh=g.cards.filter(c=>cm[c].length>1);g.pb=g.p;if(sh.length&&g.p>=.3){g.p=Math.min(1,g.p+.1);g.why.push('Ортақ карта не нөмір топты тағы '+(Math.max(...sh.map(c=>cm[c].length))-1)+' топпен байланыстырады')}g.lvl=lvl(g.p)});
/* UI */
const S={tab:'dash',sel:null,f:'all',thr:.6,dec:{}},EX='Девочки, всем привет! Вложи 5 000 тг — получи 10 000 тг уже сегодня 💸 Перевод на Kaspi 4400 4301 2345 6789. Осталось 3 места, успей! Приведи подругу — бонус. Скрин выплат в закрепе, куратор в лс';
const H=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),pc=p=>Math.round(p*100);
function hl(raw,hits){const sp=hits.flatMap(h=>h.sp).sort((a,b)=>a[0]-b[0]);let o='',i=0;for(const[s,e,c]of sp){if(s<i)continue;o+=H(raw.slice(i,s))+`<mark style="border-color:${CAT[c][1]}">${H(raw.slice(s,e))}</mark>`;i=e}return o+H(raw.slice(i))}
const tags=hits=>hits.map(h=>`<span class=tg style="border-color:${CAT[h.c][1]}"><i style="background:${CAT[h.c][1]}"></i>${h.n} ${h.c=='mit'?'−':'+'}${pc(h.w)}</span>`).join('');
const col=l=>`var(--${l=='high'?'hi':l=='mid'?'mid':'lo'})`;
function dash(){const c=l=>G.filter(g=>g.lvl==l).length,Ls=G.filter(g=>S.f=='all'||g.lvl==S.f).sort((a,b)=>b.p-a.p),g=G.find(x=>x.id==S.sel)||Ls[0];
return`<div class=kp><div><b>${G.length}</b><span>кірістегі топ</span></div><div class=h><b>${c('high')}</b><span>жоғары қауіп</span></div><div class=m><b>${c('mid')}</b><span>орташа</span></div><div class=l><b>${c('low')}</b><span>төмен</span></div><div><b>${Object.keys(S.dec).length}</b><span>талдаушы шешімі</span></div></div>
<div class=chips>${[['all','Барлығы'],['high','Жоғары'],['mid','Орташа'],['low','Төмен']].map(([k,v])=>`<button class="${S.f==k?'on':''}" onclick="S.f='${k}';go()">${v}</button>`).join('')}</div>
<div class=cols><div class=list>${Ls.map(x=>`<button class="it ${g&&x.id==g.id?'on':''}" onclick="S.sel=${x.id};go()"><span class="sc ${x.lvl}">${pc(x.p)}</span><span><b>${x.name}</b><small>${x.pl} · ${x.members} қатысушы${S.dec[x.id]?' · '+S.dec[x.id]:''}</small></span></button>`).join('')}</div>${g?det(g):''}</div>`}
function det(g){const agg={};g.ms.forEach(m=>m.hits.forEach(h=>{agg[h.n]=agg[h.n]||{...h,k:0};agg[h.n].k++}));
